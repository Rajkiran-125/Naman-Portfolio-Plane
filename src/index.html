<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Primary meta -->
  <title>Naman Gupta — Photographer & Visual Storyteller</title>
  <meta name="description"
        content="Naman Gupta is a professional photographer based in Mumbai, India — crafting cinematic portraits, naturescapes and brand stories. Explore the portfolio and book a session.">
  <meta name="author" content="Naman Gupta">
  <meta name="keywords"
        content="photographer, portrait photography, Mumbai photographer, brand photography, naturescape, travel photography, Naman Gupta">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
  <base href="/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Naman Gupta Photography">
  <meta property="og:title" content="Naman Gupta — Photographer & Visual Storyteller">
  <meta property="og:description"
        content="Cinematic portraits, naturescapes and brand stories by Mumbai-based photographer Naman Gupta.">
  <meta property="og:image" content="assets/img/bg-img/hero1.jpeg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Naman Gupta — Photographer & Visual Storyteller">
  <meta name="twitter:description"
        content="Cinematic portraits, naturescapes and brand stories by Mumbai-based photographer Naman Gupta.">
  <meta name="twitter:image" content="assets/img/bg-img/hero1.jpeg">

  <!-- Favicon -->
  <link rel="icon" href="assets/img/core-img/favicon2.png">

  <!-- Anti-flash: apply the saved theme before first paint to avoid a light flash. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('naman-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap">

  <!-- Icons (FontAwesome 6) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "Naman Gupta Photography",
    "image": "assets/img/bg-img/hero1.jpeg",
    "description": "Professional photographer specialising in portraits, naturescapes and brand stories.",
    "address": { "@type": "PostalAddress", "addressLocality": "Mumbai", "addressRegion": "Maharashtra", "addressCountry": "IN" },
    "email": "namangupta6449@gmail.com",
    "telephone": "+91 8419979591",
    "sameAs": [
      "https://www.instagram.com/ng_shooter",
      "https://www.behance.net/namanguptab17d"
    ]
  }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
