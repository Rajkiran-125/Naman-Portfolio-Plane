<footer class="footer-area">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="footer-content d-flex align-items-center justify-content-between">
          <!-- Copyright Text -->
          <div class="copywrite-text">
            <p>
              Copyright &copy;{{ year }} All rights reserved | This website is made with
              <i class="fa-regular fa-heart"></i> by
              <a [href]="site.authorUrl" target="_blank" rel="noopener">{{ site.authorName }}</a>
            </p>
          </div>

          <!-- Footer Logo -->
          <div class="footer-logo">
            <a routerLink="/"><img [src]="site.brandLogo" alt="Naman Gupta" /></a>
          </div>

          <!-- Social Info -->
          <div class="social-info">
            @for (social of socialLinks; track social.label) {
              <a [href]="social.url" target="_blank" rel="noopener" [attr.aria-label]="social.label">
                <i [class]="social.icon" aria-hidden="true"></i>
              </a>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</footer>
