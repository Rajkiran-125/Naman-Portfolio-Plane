<app-breadcrumb
  title="Journal"
  crumb="Journal"
  subtitle="Notes from behind the lens — shoots, thoughts and the craft."
  background="https://mir-s3-cdn-cf.behance.net/project_modules/fs/020613201952933.667d6969b7124.jpg"
/>

<section class="section blog">
  <div class="container">
    <div class="blog__grid">
      @for (post of posts; track $index; let i = $index) {
        <article class="post" [class.post--wide]="post.wide" appReveal="up" [revealDelay]="(i % 3) * 80">
          <a class="post__media">
            <img [src]="post.image" [alt]="post.title" loading="lazy" decoding="async" />
            <span class="post__date">{{ post.date }}</span>
          </a>
          <div class="post__body">
            <span class="post__cat">{{ post.category }}</span>
            <h2 class="post__title"><a>{{ post.title }}</a></h2>
            <div class="post__meta">
              <span><i class="fa-regular fa-comment"></i> {{ post.comments }}</span>
            </div>
            <a class="post__read link-underline">Read more <i class="fa-solid fa-arrow-right"></i></a>
          </div>
        </article>
      }
    </div>
  </div>
</section>

<app-cta-band
  eyebrow="Like what you see?"
  title="Let's create your story next"
/>
