@if (open) {
  <div class="lightbox-overlay" (click)="close()">
    <button type="button" class="lb-close" (click)="close()" aria-label="Close">
      <i class="ti-close"></i>
    </button>

    @if (images.length > 1) {
      <button type="button" class="lb-arrow lb-prev" (click)="prev($event)" aria-label="Previous">
        <i class="ti-arrow-left"></i>
      </button>
    }

    <div class="lb-figure" (click)="$event.stopPropagation()">
      <img [src]="currentSrc" alt="Gallery image" />
      @if (images.length > 1) {
        <div class="lb-counter">{{ (index ?? 0) + 1 }} / {{ images.length }}</div>
      }
    </div>

    @if (images.length > 1) {
      <button type="button" class="lb-arrow lb-next" (click)="next($event)" aria-label="Next">
        <i class="ti-arrow-right"></i>
      </button>
    }
  </div>
}
