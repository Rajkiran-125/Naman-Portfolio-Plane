<section class="ig section--soft">
  @if (showHeading) {
    <div class="container ig__head">
      <p class="eyebrow eyebrow--center">On Instagram</p>
      <h2 class="h2">
        <a [href]="'https://instagram.com/' + handle" target="_blank" rel="noopener">
          {{ '@' + handle }}
        </a>
      </h2>
    </div>
  }

  <div class="ig__feed">
    <div class="ig__track">
      @for (item of loop; track $index) {
        <a class="ig__item" [href]="item.url" target="_blank" rel="noopener" aria-label="View on Instagram">
          <img [src]="item.img" alt="Instagram photograph" loading="lazy" />
          <span class="ig__overlay"><i class="fa-brands fa-instagram" aria-hidden="true"></i></span>
        </a>
      }
    </div>
  </div>
</section>
