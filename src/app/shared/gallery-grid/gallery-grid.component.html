<div class="gallery" [class.gallery--flush]="flushTop()">
  <div class="container container--wide">
    @if (showFilters()) {
      <div class="gallery__filters" role="group" aria-label="Filter gallery">
        @for (f of filters; track f.label) {
          <button
            type="button"
            class="gallery__filter"
            [class.is-active]="activeFilter() === f.value"
            [attr.aria-pressed]="activeFilter() === f.value"
            (click)="setFilter(f.value)"
          >
            {{ f.label }}
          </button>
        }
      </div>
    }

    <div class="gallery__masonry">
      @for (item of filtered(); track item.src; let i = $index) {
        <button
          type="button"
          class="gallery__item"
          [class.is-wide]="item.wide"
          (click)="open(i)"
          appReveal="zoom"
          aria-label="Open photograph"
        >
          <img [src]="item.src" [alt]="title(item)" loading="lazy" decoding="async" />
          <span class="gallery__overlay">
            <span class="gallery__cap">
              <span class="gallery__cap-title">{{ title(item) }}</span>
              <span class="gallery__cap-meta">{{ category(item) }}</span>
            </span>
            <span class="gallery__zoom"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></span>
          </span>
        </button>
      }
    </div>
  </div>
</div>

<app-lightbox
  [images]="lightboxImages()"
  [index]="lightboxIndex()"
  (indexChange)="lightboxIndex.set($event)"
  (closed)="lightboxIndex.set(null)"
/>
